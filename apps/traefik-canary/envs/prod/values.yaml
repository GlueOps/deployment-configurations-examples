customResources:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-canary
      annotations:
        kubernetes.io/ingress.class: public-traefik
        external-dns.alpha.kubernetes.io/target: public-v2.{{ .Values.captain_domain }}
    spec:
      entryPoints:
        - web
        - websecure
      routes:
        - match: Host(`traefik-canary.apps.{{ .Values.captain_domain }}`) && HeaderRegexp(`Cookie`, `.*canary=v2.*`)
          kind: Rule
          priority: 100
          services:
            - name: traefik-canary-v2-prod
              namespace: {{ include "app.namespace" . }}
              port: 80
        - match: Host(`traefik-canary.apps.{{ .Values.captain_domain }}`)
          kind: Rule
          priority: 10
          services:
            - name: traefik-canary-v1-prod
              namespace: {{ include "app.namespace" . }}
              port: 80
