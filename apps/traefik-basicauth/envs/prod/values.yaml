deployment:
  enabled: true
  replicas: 1

service:
  enabled: true

customResources:
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: traefik-basicauth-secret
    type: Opaque
    stringData:
      users: |
        user:$apr1$glueops$SH.22y5VjPlmHVcBm5xwd.
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-basicauth
    spec:
      basicAuth:
        secret: traefik-basicauth-secret
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-basicauth
      annotations:
        kubernetes.io/ingress.class: public-traefik
        external-dns.alpha.kubernetes.io/target: public-v2.{{ .Values.captain_domain }}
    spec:
      entryPoints:
        - web
        - websecure
      routes:
        - match: Host(`{{ include "app.name" . }}.apps.{{ .Values.captain_domain }}`)
          kind: Rule
          middlewares:
            - name: traefik-basicauth
          services:
            - name: {{ include "app.name" . }}
              namespace: {{ include "app.namespace" . }}
              port: 80
