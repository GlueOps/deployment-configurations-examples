deployment:
  enabled: true
  replicas: 2
  envVariables:
    - name: NGINX_ENVSUBST_FILTER
      value: "^ORIGIN_VERIFY_"
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
  volumes:
    - name: templates
      configMap:
        name: '{{ include "app.name" . }}-nginx'
    - name: require-secret
      configMap:
        name: '{{ include "app.name" . }}-nginx'
        defaultMode: 0755
        items:
          - key: 05-require-origin-verify-secret.sh
            path: 05-require-origin-verify-secret.sh
    - name: confd
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: templates
      mountPath: /etc/nginx/templates
      readOnly: true
    - name: require-secret
      mountPath: /docker-entrypoint.d/05-require-origin-verify-secret.sh
      subPath: 05-require-origin-verify-secret.sh
    - name: confd
      mountPath: /etc/nginx/conf.d
    - name: tmp
      mountPath: /tmp

service:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Expected header value. Write it to the secret store first, e.g.:
#   vault kv put secret/traefik-cloudfront-verifier/prod ORIGIN_VERIFY_SECRET=<openssl rand -hex 32>
# Every key at this path becomes an env var in the verifier container.
externalSecret:
  enabled: true
  secrets:
    origin-verify:
      dataFrom:
        key: secret/traefik-cloudfront-verifier/prod

configMap:
  enabled: true
  configs:
    nginx:
      data: |-
        # An unset value would leave the literal "${ORIGIN_VERIFY_SECRET}" in the map as a guessable key.
        05-require-origin-verify-secret.sh: |
          #!/bin/sh
          case "$ORIGIN_VERIFY_SECRET" in
            "" | *[!A-Za-z0-9]*) echo "ORIGIN_VERIFY_SECRET must be set and alphanumeric" >&2; exit 1 ;;
          esac
        default.conf.template: |
          # The default 64-byte bucket rejects a 64-char key (openssl rand -hex 32).
          map_hash_bucket_size 128;
          map $http_x_origin_verify $origin_verified {
            default 0;
            "${ORIGIN_VERIFY_SECRET}" 1;
          }
          server {
            listen 8080;
            server_tokens off;
            access_log off;
            default_type text/plain;
            location = /healthz { return 200 "ok\n"; }
            location / {
              if ($origin_verified) { return 200; }
              return 403 "Forbidden\n";
            }
          }

customResources:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: cloudfront-origin-verify
    spec:
      forwardAuth:
        address: 'http://{{ include "app.name" . }}.{{ include "app.namespace" . }}.svc.cluster.local:8080/'
        authRequestHeaders:
          - X-Origin-Verify
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: cloudfront-strip-header
    spec:
      headers:
        customRequestHeaders:
          X-Origin-Verify: ""
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: cloudfront-origin-guard
    spec:
      chain:
        middlewares:
          - name: cloudfront-origin-verify
          - name: cloudfront-strip-header
