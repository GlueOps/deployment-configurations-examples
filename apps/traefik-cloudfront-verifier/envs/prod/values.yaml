deployment:
  enabled: true
  replicas: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
  volumes:
    - name: nginx
      configMap:
        name: '{{ include "app.name" . }}-nginx'
        # Required: the entrypoint skips non-executable scripts, and nginx would then start with no config.
        defaultMode: 0755
    - name: confd
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: nginx
      mountPath: /docker-entrypoint.d/05-origin-verify.sh
      subPath: 05-origin-verify.sh
    - name: confd
      mountPath: /etc/nginx/conf.d
    - name: tmp
      mountPath: /tmp

service:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Accepted header values, as a JSON array of letters-and-digits strings. Write it to the secret store first, e.g.:
#   vault kv put secret/traefik-cloudfront-verifier/prod 'ORIGIN_VERIFY_SECRETS=["<openssl rand -hex 32>"]'
# List two values during a rotation. Values are read at startup: after changing them, run
#   kubectl rollout restart deployment/traefik-cloudfront-verifier-prod
externalSecret:
  enabled: true
  secrets:
    origin-verify:
      dataFrom:
        key: secret/traefik-cloudfront-verifier/prod

configMap:
  enabled: true
  configs:
    nginx:
      data: |-
        05-origin-verify.sh: |
          #!/bin/sh
          # Writes the nginx config at startup with one exact, case-sensitive match per accepted value.
          set -eu
          list=$(printf %s "${ORIGIN_VERIFY_SECRETS:-}" | tr -d '\r\n')
          printf %s "$list" | grep -Eqx '[[:space:]]*\[[[:space:]]*"[A-Za-z0-9]+"[[:space:]]*(,[[:space:]]*"[A-Za-z0-9]+"[[:space:]]*)*\][[:space:]]*' || {
            echo 'ORIGIN_VERIFY_SECRETS must be a JSON array of letters-and-digits strings, e.g. ["abc123"]' >&2
            exit 1
          }
          {
            echo 'server {'
            echo '  listen 8080;'
            echo '  server_tokens off;'
            echo '  access_log off;'
            echo '  default_type text/plain;'
            echo '  location = /healthz { return 200 "ok\n"; }'
            echo '  location / {'
            printf '%s\n' "$list" | grep -Eo '"[A-Za-z0-9]+"' | tr -d '"' | while read -r v; do
              echo "    if (\$http_x_origin_verify = \"$v\") { return 200; }"
            done
            echo '    return 403 "Forbidden\n";'
            echo '  }'
            echo '}'
          } > /etc/nginx/conf.d/default.conf

customResources:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-cloudfront-origin-verify
    spec:
      forwardAuth:
        address: 'http://{{ include "app.name" . }}.{{ include "app.namespace" . }}.svc.cluster.local:8080/'
        authRequestHeaders:
          - X-Origin-Verify
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-cloudfront-strip-header
    spec:
      headers:
        customRequestHeaders:
          X-Origin-Verify: ""
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-cloudfront-origin-guard
    spec:
      chain:
        middlewares:
          - name: traefik-cloudfront-origin-verify
          - name: traefik-cloudfront-strip-header
