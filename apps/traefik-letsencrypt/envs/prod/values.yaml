deployment:
  enabled: true
  replicas: 1

service:
  enabled: true

customResources:
  - |
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: traefik-letsencrypt-cert
    spec:
      secretName: traefik-letsencrypt-cert
      issuerRef:
        name: letsencrypt-public-traefik
        kind: ClusterIssuer
      dnsNames:
        - app.example.com
        - api.example.com
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-letsencrypt-redirect
    spec:
      redirectScheme:
        scheme: https
        permanent: true
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-letsencrypt-http
      annotations:
        kubernetes.io/ingress.class: public-traefik
    spec:
      entryPoints:
        - web
      routes:
        - match: Host(`app.example.com`) || Host(`api.example.com`)
          kind: Rule
          middlewares:
            - name: traefik-letsencrypt-redirect
          services:
            - name: '{{ include "app.name" . }}'
              namespace: '{{ include "app.namespace" . }}'
              port: 80
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-letsencrypt-https
      annotations:
        kubernetes.io/ingress.class: public-traefik
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`app.example.com`) || Host(`api.example.com`)
          kind: Rule
          services:
            - name: '{{ include "app.name" . }}'
              namespace: '{{ include "app.namespace" . }}'
              port: 80
      tls:
        secretName: traefik-letsencrypt-cert
