deployment:
  enabled: true
  replicas: 1

service:
  enabled: true

customResources:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-multi-route-api
      annotations:
        kubernetes.io/ingress.class: public-traefik
        external-dns.alpha.kubernetes.io/target: public-v2.{{ .Values.captain_domain }}
    spec:
      entryPoints:
        - web
        - websecure
      routes:
        - match: Host(`traefik-multi-route-api.apps.{{ .Values.captain_domain }}`)
          kind: Rule
          services:
            - name: {{ include "app.name" . }}
              namespace: {{ include "app.namespace" . }}
              port: 80
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-multi-route-web
      annotations:
        kubernetes.io/ingress.class: public-traefik
        external-dns.alpha.kubernetes.io/target: public-v2.{{ .Values.captain_domain }}
    spec:
      entryPoints:
        - web
        - websecure
      routes:
        - match: Host(`traefik-multi-route-web.apps.{{ .Values.captain_domain }}`)
          kind: Rule
          services:
            - name: {{ include "app.name" . }}
              namespace: {{ include "app.namespace" . }}
              port: 80
